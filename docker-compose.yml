# Production setup: docker compose up -d --build
# Then open http://localhost:5000
#
# AI-assisted segmentation (SAM): set SAM to "cpu" (or use
# docker-compose.gpu.yml for NVIDIA GPUs) and run models/download_sam.sh.

x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:-ChangeThisSecretKey}
  MONGODB_HOST: mongodb://database/flask
  CELERY_BROKER_URL: amqp://user:password@messageq:5672//
  CELERY_RESULT_BACKEND: mongodb://database/flask

volumes:
  mongodb7_data:

networks:
  cocoannotator:

services:
  webserver:
    build:
      context: .
      target: webserver
      args:
        SAM: ${SAM:-none}
    image: coco-annotator-webserver
    container_name: annotator_webclient
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      <<: *backend-env
      FILE_WATCHER: "true"
      SAM_MODEL_TYPE: vit_b
      SAM_CHECKPOINT: /models/sam_vit_b_01ec64.pth
      SAM_DEVICE: auto
    volumes:
      - "${DATASETS_DIR:-./datasets}:/datasets"
      - "${MODELS_DIR:-./models}:/models"
    depends_on:
      - database
      - workers
    networks:
      - cocoannotator

  workers:
    build:
      context: .
      target: workers
    image: coco-annotator-workers
    container_name: annotator_workers
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - "${DATASETS_DIR:-./datasets}:/datasets"
    depends_on:
      - messageq
      - database
    networks:
      - cocoannotator

  messageq:
    image: rabbitmq:4.1-alpine
    container_name: annotator_message_q
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - cocoannotator

  database:
    # Data lives in the "mongodb7_data" volume. The original coco-annotator
    # used "mongodb_data" (MongoDB 4.0, which MongoDB 7 cannot open); it is
    # left untouched. Copy it over with scripts/migrate_mongo.sh (UPGRADE.md).
    image: mongo:7.0
    container_name: annotator_mongodb
    restart: unless-stopped
    volumes:
      - "mongodb7_data:/data/db"
    networks:
      - cocoannotator
