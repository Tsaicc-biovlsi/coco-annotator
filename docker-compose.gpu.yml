# NVIDIA GPU for Segment Anything. Requires the NVIDIA Container Toolkit.
#   ./models/download_sam.sh
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  webserver:
    build:
      args:
        SAM: cuda
    environment:
      SAM_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
